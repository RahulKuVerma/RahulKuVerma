name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: RahulKuVerma
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check Trophy
        run: |
          echo "Checking generated trophy..."
          ls -lh trophy.svg

      - name: Commit Trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy.svg
          git diff --cached --quiet || git commit -m "Update GitHub trophies"
          git push
