name: Generate GitHub Trophies

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0"

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Trophy
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: RahulKuVerma
          output_path: trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check generated file
        run: |
          echo "Files in current directory:"
          ls -la
          echo "Checking trophy.svg:"
          ls -lh trophy.svg

      - name: Copy Trophy to Output Branch
        run: |
          mkdir -p /tmp/trophy
          cp trophy.svg /tmp/trophy/trophy.svg

          git fetch origin output:output
          git checkout output

          cp /tmp/trophy/trophy.svg ./trophy.svg

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add trophy.svg
          git commit -m "Update GitHub trophies" || echo "No changes to commit"
          git push origin output
